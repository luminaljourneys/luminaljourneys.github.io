name: Deploy to Firebase

on:
  push:
    branches: [main, dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.22.2

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── Staging build (dev branch) ──────────────────────────────────────────
      - name: Build for Staging
        if: github.ref == 'refs/heads/dev'
        run: npm run build
        env:
          VITE_ENV: staging
          VITE_EDIT_MODE_ENABLED: 'true'
          VITE_EDIT_PASSWORD: ${{ secrets.VITE_EDIT_PASSWORD }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_MAILER_URL: ${{ secrets.VITE_MAILER_URL }}

      - name: Deploy to Staging
        if: github.ref == 'refs/heads/dev'
        run: firebase deploy --only hosting:staging --project luminaljourneys --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"

      # ── Production build (main branch) ─────────────────────────────────────
      - name: Build for Production
        if: github.ref == 'refs/heads/main'
        run: npm run build
        env:
          VITE_ENV: production
          VITE_EDIT_MODE_ENABLED: 'false'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_MAILER_URL: ${{ secrets.VITE_MAILER_URL }}

      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: firebase deploy --only hosting:production --project luminaljourneys --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"

  # ── Accessibility Audit (WCAG 2.2) ───────────────────────────────────────────
  # Runs after deploy. Audits the live URL — no secrets needed.
  # fail-on: critical blocks the pipeline only for critical violations.
  # Reports are uploaded as artifacts visible in the Actions tab.
  a11y:
    name: Accessibility Audit (WCAG 2.2 AA)
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Wait for Firebase CDN propagation
        run: sleep 20

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-accesslint

      # ── Staging audit — regression mode (new violations only vs production) ──
      - name: Audit Staging — Home
        if: github.ref == 'refs/heads/dev'
        uses: AccessLint/audit@v1
        id: a11y_staging_home
        with:
          url: https://admin.luminaljourneys.com
          compare-against: https://luminaljourneys.com
          wcag-level: AA
          min-impact: moderate
          fail-on: critical

      - name: Audit Staging — Intake
        if: github.ref == 'refs/heads/dev'
        uses: AccessLint/audit@v1
        id: a11y_staging_intake
        with:
          url: https://admin.luminaljourneys.com/intake
          compare-against: https://luminaljourneys.com/intake
          wcag-level: AA
          min-impact: moderate
          fail-on: critical

      # ── Production audit — full WCAG 2.2 AA scan ─────────────────────────────
      - name: Audit Production — all pages
        if: github.ref == 'refs/heads/main'
        uses: AccessLint/audit@v1
        id: a11y_prod
        with:
          urls: |
            https://luminaljourneys.com
            https://luminaljourneys.com/intake
          wcag-level: AA
          min-impact: moderate
          fail-on: critical

      # ── Upload report artifact — always, even if audit fails ─────────────────
      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accesslint-report-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            accesslint-report.json
            accesslint-report.md
          retention-days: 30
